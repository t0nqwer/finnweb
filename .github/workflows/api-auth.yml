name: API Auth

on:
  pull_request:
  push:

jobs:
  api-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finnweb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finnweb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finnweb_test?schema=public
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      RESEND_API_KEY: test-resend-key
      EMAIL_FROM: FinnWeb <no-reply@example.com>

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @finnweb/api exec prisma generate

      - name: Push Prisma schema
        run: pnpm --filter @finnweb/api exec prisma db push --force-reset --accept-data-loss

      - name: Seed Prisma plans
        run: pnpm --filter @finnweb/api exec prisma db seed

      - name: Run auth integration suite
        run: pnpm --filter @finnweb/api test:auth

      - name: Run API typecheck
        run: pnpm --filter @finnweb/api typecheck