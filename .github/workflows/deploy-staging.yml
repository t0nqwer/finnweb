name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finnweb_ci?schema=public
      FRONTEND_URL: https://finnweb.site
      NEXT_PUBLIC_ROOT_DOMAIN: finnweb.site
      NEXT_PUBLIC_API_BASE_URL: https://finnweb.site/api
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      JWT_SECRET: ci-jwt-secret
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      RESEND_API_KEY: test-resend-key
      EMAIL_FROM: FinnWeb <no-reply@example.com>

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finnweb_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finnweb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: verify
    environment: staging
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/finnweb/current' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      SERVICES_TO_DEPLOY: web api worker

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/finnweb_deploy_key
          chmod 600 ~/.ssh/finnweb_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/finnweb_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' ADMIN_EMAILS='$ADMIN_EMAILS' bash -s" <<'EOF'
          set -euo pipefail

          cd "$APP_DIR"

          git fetch origin main
          git reset --hard origin/main

          pnpm install --frozen-lockfile

          set -a
          source /etc/finnweb/web.env
          set +a
          pnpm build

          cd "$APP_DIR/apps/api"
          set -a
          source /etc/finnweb/api.env
          set +a
          pnpm exec prisma db push
          pnpm exec prisma db seed

          cd "$APP_DIR"
          cp deploy/systemd/finnweb-api.service /etc/systemd/system/finnweb-api.service
          cp deploy/systemd/finnweb-worker.service /etc/systemd/system/finnweb-worker.service
          cp deploy/systemd/finnweb-web.service /etc/systemd/system/finnweb-web.service
          systemctl daemon-reload
          systemctl restart finnweb-api finnweb-worker finnweb-web
          systemctl reload caddy || true

          systemctl --no-pager --full status finnweb-api finnweb-worker finnweb-web

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/api/health; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              journalctl -u finnweb-api -n 120 --no-pager
              exit 1
            fi

            sleep 2
          done

          for attempt in {1..30}; do
            if curl -fsSI http://127.0.0.1:3000; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              journalctl -u finnweb-web -n 120 --no-pager
              exit 1
            fi

            sleep 2
          done
          EOF

      - name: Notify Discord
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_LABEL="[OK]"
          if [ "$JOB_STATUS" != "success" ]; then STATUS_LABEL="[FAIL]"; fi

          CONTENT="$STATUS_LABEL Deploy Staging: $JOB_STATUS
          Repo: ${{ github.repository }}
          Services: $SERVICES_TO_DEPLOY
          Run: $RUN_URL"

          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')

          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
